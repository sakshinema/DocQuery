services:
  - type: web
    name: docquery
    runtime: python
    # Free submission-demo deployment. SQLite state is intentionally ephemeral
    # here; reviewers can upload and query within one active session.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DOCQUERY_DB_PATH
        value: /tmp/docquery.db
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
